<!doctype html>
<html><head><meta charset="utf-8"><title>Probing diagram candidates</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="palette.css">
<script src="lib/d3.min.js"></script><script src="common.js"></script><script src="data/fig_steps_fall.js"></script>
</head><body><svg id="fig"></svg>
<script>
const W = 624, BH = 284, H = BH * 3, svg = setup(W, H), F = FIG.film;
</script>
<script src="setup_diagram.js"></script>
<script>
[["A", "iso", "Isometric: layers as shaded 3D slabs on a residual stream, cards with soft shadows, accent bars"],
 ["B", "soft", "Soft gradients: rounded pills in a transformer card, a glow on the probed layer, tinted readout cards"],
 ["C", "grid", "Token grid: one shaded tile per frame token and layer (the gray bottom row is the condition token, which is not probed), banded cards"]]
  .forEach(([L, sty, d], k) => {
    const oy = k * BH;
    if (k) svg.append("line").attr("x1", 0).attr("x2", W).attr("y1", oy - 6).attr("y2", oy - 6).attr("stroke", C.axis).attr("stroke-width", 0.6);
    const h = svg.append("text").attr("x", 0).attr("y", oy + 8).style("font-size", "9px");
    h.append("tspan").style("fill", C.mark).style("font-weight", 700).text(`${L}  `);
    h.append("tspan").style("fill", C.muted).text(d);
    figure(svg.append("g").attr("transform", `translate(0,${oy + 22})`), sty);
  });
finish();
</script></body></html>
