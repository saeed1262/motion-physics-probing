<!doctype html>
<html><head><meta charset="utf-8"><title>How the labels are computed</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="palette.css">
<script src="lib/d3.min.js"></script><script src="common.js"></script><script src="data/fig_labels.js"></script>
</head><body><svg id="fig"></svg>
<script>
const W = 624, H = 330, svg = setup(W, H), R1 = 162;
const fmt = (v) => (v > 0 ? "+" : "−") + Math.abs(v).toFixed(0);

// (a) balance on the body
const A = FIG.walk;
const ta = svg.append("text").attr("class", "title").attr("x", 0).attr("y", 10);
ta.append("tspan").attr("class", "letter").text("(a) "); ta.append("tspan").text("Balance: is the extrapolated center of mass over the feet?");
svg.append("text").attr("class", "subtitle").attr("x", 0).attr("y", 22).text(`“${A.prompt}”: two frames, support region on the floor`);
const scA = d3.min(A.poses, (q) => Math.min(150 / (q.box.x1 - q.box.x0), (R1 - 56) / (q.box.y1 - q.box.y0)));   // one scale for both poses
A.poses.forEach((q, n) => {
  const bw = q.box.x1 - q.box.x0, bh = q.box.y1 - q.box.y0, sc = scA;
  const ox = n * 160 + (150 - bw * sc) / 2, oy = 30;
  const X = (p) => ox + (p[0] - q.box.x0) * sc, Y = (p) => oy + (q.box.y1 - p[1]) * sc;
  svg.append("image").attr("href", q.img).attr("x", ox).attr("y", oy).attr("width", bw * sc).attr("height", bh * sc);
  svg.append("path").attr("d", d3.line().x(X).y(Y)(q.support) + "Z").attr("fill", col("dim")).attr("fill-opacity", 0.18)
    .attr("stroke", col("dim")).attr("stroke-width", 0.9);
  const inside = q.margin >= 0, c = inside ? col("ok") : col("mark");
  svg.append("line").attr("x1", X(q.com)).attr("y1", Y(q.com)).attr("x2", X(q.xcom)).attr("y2", Y(q.xcom))
    .attr("stroke", col("ink")).attr("stroke-width", 0.9);
  svg.append("circle").attr("cx", X(q.com)).attr("cy", Y(q.com)).attr("r", 2.2).attr("fill", col("ink"));
  svg.append("circle").attr("cx", X(q.xcom)).attr("cy", Y(q.xcom)).attr("r", 3.2).attr("fill", c).attr("stroke", "#fff").attr("stroke-width", 0.8);
  const t = svg.append("text").attr("x", n * 160 + 75).attr("y", R1 - 8).attr("text-anchor", "middle");
  t.append("tspan").style("fill", c).style("font-weight", 650).text(inside ? "inside" : "outside");
  t.append("tspan").text(`, margin ${fmt(100 * q.margin)} cm`);
});
svg.append("text").attr("class", "annot-muted").attr("x", 0).attr("y", R1 + 2)
  .text("dark dot: center of mass on the floor; colored dot: extrapolated center of mass");

// (b) margins over time
{
  const p = panel(svg, 330, 0, 294, R1, { t: 34, r: 50, b: 28, l: 30 });
  title(p, "b", "Margins over the same walk", "cm, positive inside the support region");
  const x = d3.scaleLinear().domain(d3.extent(A.t)).range([0, p.w]);
  const vals = A.dyn.concat(A.stat).filter((v) => v !== null);
  const y = d3.scaleLinear().domain([Math.min(-10, d3.min(vals)), Math.max(10, d3.max(vals))]).nice().range([p.h, 0]);
  axes(p, x, y, { yTicks: 4, xLabel: "time (s)", xFormat: (d) => d.toFixed(1) });
  p.inner.append("line").attr("class", "zero").attr("x1", 0).attr("x2", p.w).attr("y1", y(0)).attr("y2", y(0));
  const pts = (arr) => A.t.map((t, i) => [t, arr[i]]).filter((d) => d[1] !== null);
  p.inner.append("path").attr("d", d3.area().defined((d) => d[1] !== null).x((d) => x(d[0])).y0(y(0)).y1((d) => y(Math.min(0, d[1])))(A.t.map((t, i) => [t, A.dyn[i]])))
    .attr("fill", col("mark")).attr("opacity", 0.16);
  [["stat", "static", col("ink")], ["dyn", "dynamic", col("mark")]].forEach(([k, lab, c]) => {
    p.inner.append("path").attr("d", d3.line().defined((d) => d[1] !== null).x((d) => x(d[0])).y((d) => y(d[1]))(A.t.map((t, i) => [t, A[k][i]])))
      .attr("fill", "none").attr("stroke", c).attr("stroke-width", k === "dyn" ? 1.6 : 1.1);
    const last = pts(A[k]).slice(-1)[0];
    (p.labels = p.labels || []).push({ x: x(last[0]) + 5, y: y(last[1]), text: lab, color: c });
  });
  placeLabels(p);
  A.poses.forEach((q) => p.inner.append("circle").attr("cx", x(q.t)).attr("cy", y(100 * q.margin)).attr("r", 3)
    .attr("fill", q.margin >= 0 ? col("ok") : col("mark")).attr("stroke", "#fff").attr("stroke-width", 0.8));
}

// (c, d) the gravity test
function gravity(D, L, name, x0, r = 8) {
  const p = panel(svg, x0, R1 + 8, 304, H - R1 - 8, { t: 34, r, b: 28, l: 30 });
  title(p, L, name, `“${D.prompt.replace(/^a person /, "")}”: center-of-mass height (m)`);
  const x = d3.scaleLinear().domain(d3.extent(D.com, (d) => d[0])).range([0, p.w]);
  const y = d3.scaleLinear().domain([0, d3.max(D.com, (d) => d[1]) + 0.25]).nice().range([p.h, 0]);
  D.stretches.forEach((s) => p.inner.append("rect").attr("x", x(s.t0 - 0.025)).attr("width", x(s.t1 + 0.025) - x(s.t0 - 0.025))
    .attr("y", 0).attr("height", p.h).attr("fill", s.floating ? col("mark") : col("ok")).attr("opacity", 0.13));
  axes(p, x, y, { yTicks: 4, xLabel: "time (s)", xFormat: (d) => d.toFixed(1) });
  p.inner.append("path").attr("d", d3.line().x((d) => x(d[0])).y((d) => y(d[1]))(D.foot)).attr("fill", "none")
    .attr("stroke", col("neutral")).attr("stroke-width", 1.1);
  p.inner.append("path").attr("d", d3.line().x((d) => x(d[0])).y((d) => y(d[1]))(D.com)).attr("fill", "none")
    .attr("stroke", col("ink")).attr("stroke-width", 1.3);
  D.stretches.forEach((s) => {
    const c = s.floating ? col("mark") : col("ok");
    p.inner.append("path").attr("d", d3.line().x((d) => x(d[0])).y((d) => y(d[1]))(s.fit)).attr("fill", "none")
      .attr("stroke", c).attr("stroke-width", 2).attr("stroke-dasharray", "2 1.6");
    const top = d3.max(s.fit, (d) => d[1]);
    p.inner.append("text").attr("x", x((s.t0 + s.t1) / 2)).attr("y", y(top) - 5).attr("text-anchor", "middle")
      .style("fill", c).style("font-weight", 650).text(`ĝ = ${s.g.toFixed(1)}`);
  });
  p.inner.append("text").attr("x", 2).attr("y", y(0.06)).style("fill", col("muted")).text("lowest foot");
  return { p, x, y };
}
const jumpG = FIG.jump.stretches.find((s) => !s.floating);
gravity(FIG.jump, "c", `A jump falls at ${jumpG.g.toFixed(1)} m/s²`, 0);
const d = gravity(FIG.float, "d", "A floating walk barely falls", 320, 66);
// inset: one floating frame, with the gap under the feet
const I = FIG.float.inset, bw = I.box.x1 - I.box.x0, bh = I.box.y1 - I.box.y0, sc = 78 / bh;
const ix = 320 + 304 - 60 + (60 - bw * sc) / 2, iy = R1 + 8 + 34;
svg.append("rect").attr("x", ix - 3).attr("y", iy - 3).attr("width", bw * sc + 6).attr("height", bh * sc + 6).attr("fill", "#fff")
  .attr("stroke", col("grid"));
svg.append("image").attr("href", I.img).attr("x", ix).attr("y", iy).attr("width", bw * sc).attr("height", bh * sc);
const fy = iy + (I.box.y1 - 0) * sc, gy = iy + (I.box.y1 - I.lowest_vertex) * sc, gx = ix + bw * sc + 1;
svg.append("line").attr("x1", gx).attr("x2", gx).attr("y1", gy).attr("y2", fy).attr("stroke", col("mark")).attr("stroke-width", 1.2);
svg.append("text").attr("x", 320 + 304 - 30).attr("y", fy + 14).attr("text-anchor", "middle").style("fill", col("mark")).style("font-weight", 650)
  .text(`${Math.round(100 * I.gap)} cm up`);
</script></body></html>
